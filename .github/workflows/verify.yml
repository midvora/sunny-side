name: Verify

# Clean-machine run of the same checks as `npm run verify`, so the result does not depend on one developer's box.
# Pushes to main run the same checks inside deploy.yml, so this one covers pull requests and manual runs.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
